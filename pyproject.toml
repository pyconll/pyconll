[project]
name = "pyconll"
authors = [{ name = "Matias Grioni", email = "matgrioni@gmail.com" }]
description = "Read and manipulate CoNLL files"
license = "MIT"
keywords = ["nlp", "conllu", "conll", "universal dependencies"]
readme = "README.md"
requires-python = "~=3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities"
]
dynamic = ["version"]

[project.urls]
homepage = "https://pyconll.github.io"
source = "https://github.com/pyconll/pyconll"
documentation = "https://pyconll.readthedocs.io/en/stable/"

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.setuptools]
packages = ["pyconll"]

[tool.setuptools.dynamic]
version = { attr = "pyconll.__version__" }

[tool.setuptools.package-data]
pyconll = ["py.typed", "_version"]

[tool.black]
line-length = 100
target-version = ["py314"]
preview = true

[tool.uv.sources]
guppy3 = { git = "https://github.com/zhuyifei1999/guppy3.git", rev = "da86ab98abf20c57b9ead4d653157af8baaa8efd" }

[build-system]
requires = ["setuptools", "util"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "boto3>=1.43.40",
    "codespell>=2.4.2",
    "conllu>=6.0.0",
    "coverage>=7.15.0",
    "coveralls>=4.1.0",
    "guppy3",
    "mypy>=2.1.0",
    "mypy-extensions>=1.1.0",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "sphinx==8.2.3",
    "sphinx-rtd-theme==3.0.2",
]
