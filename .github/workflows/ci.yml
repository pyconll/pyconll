name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  unittest:
    name: Unit Test ${{ matrix.py }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        py: ['3.14']
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: |
          uv sync --locked --all-extras --dev
      - name: Run tests
        run: |
          uv run make coveragetest
      - name: Publish to coveralls.io
        run: |
          uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  inttest:
    name: Integration Test
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::881490118399:role/pyconll-di
          aws-region: us-east-1
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: |
          uv sync --locked --all-extras --dev
      - uses: actions/cache@v5
        with:
          path: tests/int/_corpora_cache/
          key: int-corpora-cache-${{ hashFiles('tests/int/corpora.py') }}
      - name: Run
        run: |
          uv run make inttest

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
      - name: Run
        run: |
          uv sync --locked --all-extras --dev
          uv run make lint
